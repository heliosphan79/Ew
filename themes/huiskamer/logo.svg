<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">
    <!-- Een spiraal die naar binnen draait en eindigt in een koperen punt:
         je gedachten uitrollen, tot je bij de kern komt. De lijn loopt van
         buiten naar binnen (het pad begint aan het losse buitenste einde),
         dus de animaties hieronder volgen die richting:
         1. bij het laden tekent de spiraal zich van buiten naar binnen en
            gloeit het koperen punt op zodra hij daar aankomt;
         2. daarna loopt er elke paar seconden een koperen lichtje naar
            binnen, met opnieuw een zachte gloed in het punt.
         Het meedraaien met het scrollen en de kwartslag bij hover staan in
         style.css (daar kan een afbeelding de pagina-waarden gebruiken).
         Inkt + koper, vaste kleuren: een logo-afbeelding kan niet per
         kleurschema herkleuren. Zonder animatie (prefers-reduced-motion)
         blijft de stilstaande spiraal over. -->
    <style>
        .spiral { stroke-dasharray: 1 2; stroke-dashoffset: 0; animation: draw 2.2s cubic-bezier(.45,.1,.3,1) 1 backwards; }
        .comet { stroke-dasharray: 0.07 1.2; stroke-dashoffset: 0.07; opacity: 0; animation: run 8s cubic-bezier(.4,0,.5,1) 3.4s infinite; }
        .halo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: glow-in 2.6s ease-out 1 backwards, glow 8s ease-out 3.4s infinite; }
        .core { transform-box: fill-box; transform-origin: center; animation: pop-in 2.6s ease-out 1 backwards, pulse 8s ease-out 3.4s infinite; }
        @keyframes draw { from { stroke-dashoffset: 1.02; } to { stroke-dashoffset: 0; } }
        @keyframes run { 0% { stroke-dashoffset: 0.07; opacity: 0; } 4% { opacity: 1; } 36% { stroke-dashoffset: -1.02; opacity: 1; } 38%, 100% { stroke-dashoffset: -1.02; opacity: 0; } }
        @keyframes pop-in { 0%, 70% { transform: scale(1); } 82% { transform: scale(1.5); } 100% { transform: scale(1); } }
        @keyframes glow-in { 0%, 68% { opacity: 0; transform: scale(.6); } 80% { opacity: .45; transform: scale(1.2); } 100% { opacity: 0; transform: scale(2.1); } }
        @keyframes pulse { 0%, 33% { transform: scale(1); } 38% { transform: scale(1.5); } 50%, 100% { transform: scale(1); } }
        @keyframes glow { 0%, 33% { opacity: 0; transform: scale(.6); } 38% { opacity: .45; transform: scale(1.2); } 52%, 100% { opacity: 0; transform: scale(2.1); } }
        @media (prefers-reduced-motion: reduce) { .spiral, .comet, .halo, .core { animation: none; } }
    </style>
