<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">
    <!-- Het ene pijltje: een kudde gelijke pijlen die dezelfde kant op
         wijst, en eentje die zijn eigen weg gaat. Eigen-wijzer, letterlijk.
         Inkt + een warm koperaccent, zodat het op elke lichte zijbalktint
         werkt (een logo-afbeelding kan niet per kleurschema herkleuren). -->
    <g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#2f2b25">
            <path d="M10 100 V40 M2 49 L10 40 L18 49"/>
            <path d="M30 100 V40 M22 49 L30 40 L38 49"/>
            <path d="M50 100 V40 M42 49 L50 40 L58 49"/>
            <path d="M70 100 V40 M62 49 L70 40 L78 49"/>
        </g>
        <g stroke="#b7773f" transform="rotate(30 88 100)">
            <path d="M88 100 V42 M79 52 L88 42 L97 52"/>
        </g>
    </g>
</svg>
